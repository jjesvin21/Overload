        .material-symbols-outlined {

        /* Custom Utilities for Glassmorphism */
        .glass-card {
            background: rgba(18, 18, 18, 0.6);

            border: 1px solid rgba(229, 226, 225, 0.1);
        }
        
        .etched-input {
            background: rgba(0, 0, 0, 0.3);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        
        .etched-input:focus {
            border-color: rgba(252, 76, 2, 0.5);
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 8px rgba(252, 76, 2, 0.2);
        }
        
        /* Blob Animation */
        @keyframes blob-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        
        .animate-blob {
            animation: blob-float 15s infinite alternate ease-in-out;
        }
        
        /* Progress Ring Animation */
        @keyframes stroke-dash {
            from { stroke-dashoffset: 283; } /* 2 * PI * r (45) */
            to { stroke-dashoffset: 0; }
        }
        
        .animate-ring {
            stroke-dasharray: 283;
